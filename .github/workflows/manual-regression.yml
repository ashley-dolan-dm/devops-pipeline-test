name: "Manual regression run"
# Runs the regression tests against any sandbox on request.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Sandbox to test"
        required: true
        type: choice
        options:
          - "QA"
      apex_test_suites:
        description: "Comma-separated Apex test suites. Leave blank for the APEX_TEST_SUITES variable, or all local tests if that is not set."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  regression:
    uses: ./.github/workflows/reusable-regression.yml
    with:
      environment: ${{ inputs.environment }}
      apex_test_suites: ${{ inputs.apex_test_suites || vars.APEX_TEST_SUITES }}
    secrets: inherit
