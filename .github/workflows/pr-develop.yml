name: "Pull request into develop"
# Validates feature work against QA (and Integration, if used) before it is merged.

on:
  pull_request:
    branches:
      - "develop"

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: "Check source branch"
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request comes from an allowed branch
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            feature/*|bugfix/*|main) echo "$HEAD can be merged into ${{ github.base_ref }}." ;;
            *)
              echo "::error::Pull requests into ${{ github.base_ref }} must come from: feature/*, bugfix/*, main. This one comes from $HEAD."
              exit 1
              ;;
          esac

  validate_qa:
    needs: source
    uses: ./.github/workflows/reusable-validate.yml
    with:
      environment: "QA"
      base_ref: ${{ github.base_ref }}
      test_level: "RunLocalTests"
      static_analysis: true
    secrets: inherit


  checks:
    name: "PR checks passed"
    if: always()
    runs-on: ubuntu-latest
    needs:
      - source
      - validate_qa
    steps:
      - name: Check every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::One or more checks failed."
              exit 1
            fi
          done
